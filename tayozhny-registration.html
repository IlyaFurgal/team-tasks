<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Регистрация на мероприятие · Парк-отель «Таёжный»</title>
<style>
  :root{
    --green-dark:#1f3027;
    --green-mid:#2e463a;
    --green-soft:#3b5446;
    --sand:#f3ede0;
    --sand-line:#c9c0a8;
    --gold:#c9a24a;
    --gold-dark:#b38d34;
    --muted:#6b7a64;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--green-dark);
    background-image:radial-gradient(circle at 50% 0%, #294035 0%, #1f3027 60%);
    color:var(--green-dark);
  }
  .card{
    width:100%;
    max-width:460px;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
  }
  .head{
    padding:34px 30px 26px;
    text-align:center;
    background:var(--green-dark);
    border-bottom:1px solid var(--green-mid);
  }
  .eyebrow{
    font-size:12px;letter-spacing:3px;color:var(--gold);
    text-transform:uppercase;margin-bottom:10px;
  }
  .logo{font-size:34px;font-weight:500;color:#f3ede0;line-height:1.05;}
  .subtitle{margin-top:16px;font-size:15px;color:#b8c4ad;}
  .body{padding:26px 30px 30px;background:var(--sand);}
  label{display:block;font-size:13px;color:var(--green-soft);margin:0 0 6px;font-weight:500;}
  input{
    width:100%;height:46px;padding:0 14px;font-size:16px;
    background:#fff;border:1px solid var(--sand-line);
    border-radius:9px;color:var(--green-dark);
    margin-bottom:16px;transition:border-color .15s,box-shadow .15s;
  }
  input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,74,.25);}
  button{
    width:100%;background:var(--gold);color:var(--green-dark);
    border:none;font-size:16px;font-weight:600;padding:14px;
    border-radius:9px;cursor:pointer;margin-top:6px;
    transition:background .15s,transform .05s;
  }
  button:hover{background:var(--gold-dark);}
  button:active{transform:scale(.99);}
  button:disabled{opacity:.6;cursor:default;}
  .hint{text-align:center;font-size:12px;color:var(--muted);margin:14px 0 0;}
  .ok{
    display:none;text-align:center;padding:40px 30px;background:var(--sand);
  }
  .ok .ic{
    width:64px;height:64px;border-radius:50%;background:var(--green-dark);
    color:var(--gold);display:flex;align-items:center;justify-content:center;
    font-size:34px;margin:0 auto 18px;
  }
  .ok h2{font-size:22px;color:var(--green-dark);margin:0 0 8px;font-weight:500;}
  .ok p{font-size:15px;color:var(--green-soft);margin:0;}
  .err{color:#a32d2d;font-size:13px;text-align:center;margin:10px 0 0;display:none;}
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="eyebrow">парк-отель</div>
      <div class="logo">Таёжный</div>
      <div class="subtitle">Регистрация на мероприятие · суббота</div>
    </div>

    <div class="body" id="formWrap">
      <label for="fio">ФИО</label>
      <input type="text" id="fio" placeholder="Иван Иванов" autocomplete="name">

      <label for="phone">Телефон</label>
      <input type="tel" id="phone" placeholder="+7 (___) ___-__-__" autocomplete="tel">

      <label for="tg">Ник в Telegram</label>
      <input type="text" id="tg" placeholder="@username">

      <label for="qty">Количество человек</label>
      <input type="number" id="qty" min="1" value="1">

      <button id="submitBtn" onclick="submitForm()">🌿 Записаться</button>
      <div class="err" id="err"></div>
      <p class="hint">Нажимая кнопку, вы соглашаетесь на обработку данных</p>
    </div>

    <div class="ok" id="okWrap">
      <div class="ic">✓</div>
      <h2>Вы записаны!</h2>
      <p>Спасибо за заявку. Мы свяжемся с вами в Telegram.</p>
    </div>
  </div>

<script>
  // ВСТАВЬТЕ СЮДА URL вашего Google Apps Script (см. инструкцию)
  const SHEET_URL = "https://script.google.com/macros/s/AKfycbw1k4vZ8RlYNcR-I__SdMFDxBiQEDT0HkHloHXe0O9uTyhBECc04iavEbjnlfWX6hTHsA/exec";

  function submitForm(){
    const fio = document.getElementById('fio').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const tg = document.getElementById('tg').value.trim();
    const qty = document.getElementById('qty').value.trim();
    const err = document.getElementById('err');
    const btn = document.getElementById('submitBtn');

    err.style.display = 'none';

    if(!fio || !phone){
      err.textContent = 'Заполните, пожалуйста, ФИО и телефон.';
      err.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Отправляем…';

    const data = new URLSearchParams({
      fio: fio, phone: phone, tg: tg, qty: qty,
      ts: new Date().toLocaleString('ru-RU')
    });

    fetch(SHEET_URL, { method:'POST', mode:'no-cors', body:data })
      .then(() => {
        document.getElementById('formWrap').style.display = 'none';
        document.getElementById('okWrap').style.display = 'block';
      })
      .catch(() => {
        err.textContent = 'Не удалось отправить. Попробуйте ещё раз.';
        err.style.display = 'block';
        btn.disabled = false;
        btn.textContent = '🌿 Записаться';
      });
  }
</script>
</body>
</html>
