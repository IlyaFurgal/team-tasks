<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мои задачи</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600;700&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --accent:#c9a96e;
  --done:#3d8f5f; --pending:#3d6fb5; --danger:#c94a4a;
  --radius:12px; --font-head:'Unbounded',sans-serif; --font-body:'Golos Text',sans-serif;
  --bg:#0f0f0f; --surface:#181818; --surface2:#222222; --border:#2a2a2a;
  --text:#f0ece4; --text2:#8a8278; --text3:#5a5550;
}
[data-theme="light"] {
  --bg:#f5f0e8; --surface:#ffffff; --surface2:#f0ebe0; --border:#e0d8cc;
  --text:#1a1510; --text2:#6b5f50; --text3:#a09080;
  --done:#2d7a4f; --pending:#2d5a9e; --danger:#b03030;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100vh;max-width:480px;margin:0 auto}

#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at 50% 30%,#1a1408 0%,#0f0f0f 70%)}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:40px 32px;width:100%;text-align:center}
.login-logo{font-family:var(--font-head);font-size:10px;letter-spacing:4px;color:var(--accent);text-transform:uppercase;margin-bottom:28px}
.login-title{font-family:var(--font-head);font-size:20px;font-weight:600;margin-bottom:28px}

.input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:var(--font-body);font-size:15px;padding:14px 16px;outline:none;transition:border-color .2s;margin-bottom:12px}
.input:focus{border-color:var(--accent)}
.input::placeholder{color:var(--text3)}
textarea.input{resize:none;min-height:80px;margin-bottom:0}

.btn{width:100%;background:var(--accent);color:#0f0f0f;border:none;border-radius:var(--radius);font-family:var(--font-head);font-size:12px;font-weight:600;letter-spacing:1px;padding:14px;cursor:pointer;transition:opacity .2s;-webkit-tap-highlight-color:transparent}
.btn:hover{opacity:.9}
.btn.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);margin-top:8px}
.btn.ghost{background:none;color:var(--text2);border:1px solid var(--border);font-size:13px;padding:10px}
.btn.small-btn{width:auto;padding:8px 16px;font-size:11px}

.error-msg{color:var(--danger);font-size:13px;margin-top:10px;min-height:20px}
#app{display:none;min-height:100vh}

.app-header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.app-greeting{font-family:var(--font-head);font-size:13px;font-weight:600}
.app-object{font-size:11px;color:var(--accent);margin-top:2px;letter-spacing:1px}
.logout-btn{background:none;border:none;color:var(--text3);font-size:22px;cursor:pointer;padding:4px}
.theme-toggle{background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:16px;width:32px;height:32px;border-radius:8px;cursor:pointer;transition:all .2s}
.theme-toggle:hover{border-color:var(--accent)}

.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:61px;z-index:99}
.tab{flex:1;background:none;border:none;color:var(--text2);font-family:var(--font-body);font-size:13px;padding:14px 8px;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;-webkit-tap-highlight-color:transparent}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

.content{padding:20px 16px}

/* Tasks */
.task-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;transition:border-color .2s}
.task-item.done{opacity:.6;border-color:rgba(74,158,107,.3)}
.task-item.overdue{border-color:rgba(201,74,74,.4)}
.task-header{display:flex;align-items:flex-start;gap:12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.checkbox{width:24px;height:24px;border:2px solid var(--border);border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s;margin-top:1px}
.task-item.done .checkbox{background:var(--done);border-color:var(--done);color:#fff;font-size:14px}
.task-body{flex:1}
.task-title{font-size:15px;font-weight:500;line-height:1.4;margin-bottom:4px}
.task-item.done .task-title{text-decoration:line-through;color:var(--text2)}
.task-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2);flex-wrap:wrap}
.task-deadline.overdue{color:var(--danger)}
.task-notes{font-size:12px;color:var(--text2);margin-top:6px;font-style:italic}

.done-comment{margin-top:12px;padding:10px 12px;background:rgba(74,158,107,.08);border-radius:8px;border-left:2px solid var(--done);font-size:13px;color:var(--text2);font-style:italic}

/* Comments thread in task */
.task-comments{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)}
.task-comment-item{margin-bottom:8px;padding:8px 10px;background:var(--surface2);border-radius:8px;font-size:13px}
.task-comment-item.admin{border-left:2px solid var(--accent)}
.task-comment-item.employee{border-left:2px solid var(--pending)}
.comment-who{font-size:11px;color:var(--text3);margin-bottom:3px}

/* Complete expand */
.complete-expand{margin-top:12px;display:none}
.complete-expand.open{display:block}
.complete-expand textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--font-body);font-size:14px;padding:12px;outline:none;resize:none;height:80px;margin-bottom:10px;transition:border-color .2s}
.complete-expand textarea:focus{border-color:var(--accent)}
.complete-expand textarea::placeholder{color:var(--text3)}
.complete-actions{display:flex;gap:8px}
.complete-actions .btn{flex:1;padding:10px;font-size:11px}

/* Add comment in task */
.add-note-row{display:flex;gap:8px;margin-top:8px}
.add-note-row input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--font-body);font-size:13px;padding:8px 10px;outline:none}
.add-note-row input:focus{border-color:var(--accent)}

/* Self-task form */
.self-task-form{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:20px}
.self-task-title{font-family:var(--font-head);font-size:12px;margin-bottom:12px;color:var(--accent)}

/* Stats */
.stats-period{display:flex;gap:8px;margin-bottom:20px}
.period-btn{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text2);font-family:var(--font-body);font-size:13px;padding:10px;cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent}
.period-btn.active{background:var(--surface2);color:var(--accent);border-color:#8b6914}
.big-stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;text-align:center;margin-bottom:16px}
.big-number{font-family:var(--font-head);font-size:56px;font-weight:700;color:var(--accent);line-height:1;margin-bottom:8px}
.big-label{font-size:14px;color:var(--text2)}
.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center}
.stat-num{font-family:var(--font-head);font-size:28px;font-weight:600;margin-bottom:4px}
.stat-num.done-color{color:var(--done)}
.stat-num.pending-color{color:var(--pending)}
.stat-label{font-size:12px;color:var(--text2)}

/* Checkin */
.checkin-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.checkin-title{font-family:var(--font-head);font-size:13px;font-weight:600;margin-bottom:4px}
.checkin-sub{font-size:13px;color:var(--text2);margin-bottom:20px;line-height:1.5}
.form-label{display:block;font-size:11px;color:var(--text2);letter-spacing:.5px;margin-bottom:6px;margin-top:14px}

.loading{display:flex;align-items:center;justify-content:center;padding:40px;color:var(--text2);font-size:14px;gap:10px}
.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">Княже · Таёжный</div>
    <div class="login-title">Мои задачи</div>
    <input type="text" class="input" id="empName" placeholder="Твоё имя">
    <input type="password" class="input" id="empPass" placeholder="Пароль" onkeydown="if(event.key==='Enter')empLogin()">
    <button class="btn" onclick="empLogin()">ВОЙТИ</button>
    <div style="margin-top:16px">
      <button class="theme-toggle" onclick="toggleTheme()" id="themeBtnLogin" style="margin:0 auto;display:block">🌙</button>
    </div>
    <div class="error-msg" id="empLoginError"></div>
  </div>
</div>

<div id="app">
  <header class="app-header">
    <div>
      <div class="app-greeting" id="greetingName">Привет!</div>
      <div class="app-object" id="greetingObject"></div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="theme-toggle" onclick="toggleTheme()" id="themeBtnHeader">🌙</button>
      <button class="logout-btn" onclick="empLogout()">⎋</button>
    </div>
  </header>

  <div class="tabs">
    <button class="tab active" onclick="showTab('tasks',this)">📋 Задачи</button>
    <button class="tab" onclick="showTab('stats',this)">📊 Статистика</button>
    <button class="tab" onclick="showTab('checkin',this)">✍️ Отчёт</button>
    <button class="tab" onclick="showTab('history',this)">🗂 Архив</button>
  </div>

  <div class="content">
    <div id="tab-tasks">
      <!-- Self-task form -->
      <div class="self-task-form">
        <div class="self-task-title">+ ДОБАВИТЬ СВОЮ ЗАДАЧУ</div>
        <input type="text" class="input" id="selfTaskTitle" placeholder="Название задачи" style="margin-bottom:8px">
        <input type="date" class="input" id="selfTaskDeadline" style="margin-bottom:8px">
        <select class="input" id="selfTaskPriority" style="margin-bottom:8px">
          <option value="critical">🔴 Критически важно</option>
          <option value="high">🟠 Важно</option>
          <option value="medium" selected>🟡 Средней важности</option>
          <option value="low">🟢 Малой важности</option>
        </select>
        <button class="btn" onclick="addSelfTask()">Добавить задачу</button>
      </div>
      <div id="tasksList"><div class="loading"><div class="spinner"></div> Загрузка...</div></div>
    </div>

    <div id="tab-stats" style="display:none">
      <div class="stats-period">
        <button class="period-btn active" onclick="showStats('week',this)">Неделя</button>
        <button class="period-btn" onclick="showStats('month',this)">Месяц</button>
        <button class="period-btn" onclick="showStats('all',this)">Всё время</button>
      </div>
      <div id="statsContent"><div class="loading"><div class="spinner"></div> Загрузка...</div></div>
    </div>

    <div id="tab-history" style="display:none">
      <div id="myCheckinsContent"><div class="loading"><div class="spinner"></div> Загрузка...</div></div>
    </div>

    <div id="tab-history" style="display:none">
      <div id="myCheckinsContent"><div class="loading"><div class="spinner"></div> Загрузка...</div></div>
    </div>

    <div id="tab-checkin" style="display:none">
      <div class="checkin-card">
        <div class="checkin-title">Еженедельный отчёт</div>
        <div class="checkin-sub">Заполни перед понедельничной планёркой. Коротко и по делу.</div>
        <label class="form-label">ЧТО СДЕЛАНО ЗА НЕДЕЛЮ *</label>
        <textarea class="input" id="ciDone" placeholder="Какие задачи закрыл, что сдвинул..."></textarea>
        <label class="form-label">ПЛАНЫ НА СЛЕДУЮЩУЮ НЕДЕЛЮ *</label>
        <textarea class="input" id="ciWillDo" placeholder="Что буду делать, на что фокус..."></textarea>
        <label class="form-label">ГДЕ НУЖНА ПОДДЕРЖКА</label>
        <textarea class="input" id="ciNeedHelp" placeholder="Где застрял, что мешает... (необязательно)"></textarea>
        <button class="btn" style="margin-top:16px" onclick="submitCheckin()">Отправить отчёт</button>
        <div class="error-msg" id="checkinMsg"></div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL: Редактировать чекпоинт -->
<div id="modalEditCheckin" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:center;justify-content:center;padding:20px">
  <div style="background:#181818;border:1px solid #2a2a2a;border-radius:20px;padding:28px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto">
    <div style="font-family:var(--font-head);font-size:14px;font-weight:600;margin-bottom:20px">Редактировать отчёт</div>
    <input type="hidden" id="editCheckinId">
    <label class="form-label" style="margin-top:0">ЧТО СДЕЛАНО *</label>
    <textarea class="input" id="editCiDone" style="min-height:80px;margin-bottom:0"></textarea>
    <label class="form-label">ПЛАНЫ *</label>
    <textarea class="input" id="editCiWillDo" style="min-height:80px;margin-bottom:0"></textarea>
    <label class="form-label">ГДЕ НУЖНА ПОМОЩЬ</label>
    <textarea class="input" id="editCiNeedHelp" style="min-height:60px;margin-bottom:0"></textarea>
    <div style="display:flex;gap:10px;margin-top:20px">
      <button class="btn secondary" onclick="document.getElementById('modalEditCheckin').style.display='none'">Отмена</button>
      <button class="btn" onclick="saveEditCheckin()">Сохранить</button>
    </div>
  </div>
</div>

<script>
const PB_URL = 'https://pocketbase-production-9829.up.railway.app';

const PRIORITY_MAP = {
  critical:{ icon:'🔴', label:'Критически важно', order:0 },
  high:    { icon:'🟠', label:'Важно',            order:1 },
  medium:  { icon:'🟡', label:'Средняя важность', order:2 },
  low:     { icon:'🟢', label:'Малая важность',   order:3 },
};

let employee = null;
let allTasks = [];

// PocketBase API
function sbQueryToPb(query) {
  if (!query) return {};
  const params = {};
  const qs = query.startsWith('?') ? query.slice(1) : query;
  const filters = [];
  for (const part of qs.split('&')) {
    const [key, val] = part.split('=');
    if (!key || !val) continue;
    const decoded = decodeURIComponent(val);
    if (key === 'order') {
      const [field, dir] = decoded.split('.');
      params.sort = (dir === 'desc' ? '-' : '') + field;
    } else {
      const vm = decoded.match(/^(eq|neq|gt|gte|lt|lte|like|ilike)\.(.+)$/);
      if (vm) {
        const [, op, v] = vm;
        const pbOp = {eq:'=',neq:'!=',gt:'>',gte:'>=',lt:'<',lte:'<=',like:'~',ilike:'~'}[op]||'=';
        const quoted = (v === 'true' || v === 'false') ? v : '"' + v + '"';
        filters.push(key + pbOp + quoted);
      }
    }
  }
  if (filters.length) params.filter = filters.join('&&');
  return params;
}

async function sb(method, table, body=null, query='') {
  const pbParams = sbQueryToPb(query);
  let url = PB_URL + '/api/collections/' + table + '/records';
  
  const idMatch = query.match(/[?&]id=eq\.([^&]+)/);
  
  if ((method === 'PATCH' || method === 'DELETE') && idMatch) {
    const id = decodeURIComponent(idMatch[1]);
    url = PB_URL + '/api/collections/' + table + '/records/' + id;
    const opts = { method: method === 'PATCH' ? 'PATCH' : 'DELETE', headers: {'Content-Type':'application/json'} };
    if (body) opts.body = JSON.stringify(body);
    await fetch(url, opts);
    return { ok: true };
  }
  
  if (method === 'GET') {
    const qStr = Object.entries(pbParams).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
    url += '?' + (qStr ? qStr + '&' : '') + 'perPage=500';
    const res = await fetch(url);
    const data = await res.json();
    if (!res.ok) throw new Error(data.message||'DB error');
    return data.items || [];
  }
  
  if (method === 'POST') {
    const opts = { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) };
    const res = await fetch(url, opts);
    const data = await res.json();
    if (!res.ok) throw new Error(data.message||'DB error');
    return [data];
  }
  
  return { ok: true };
}

// THEME
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  const icon = next === 'light' ? '☀️' : '🌙';
  ['themeBtnLogin','themeBtnHeader'].forEach(id => {
    const btn = document.getElementById(id);
    if (btn) btn.textContent = icon;
  });
  localStorage.setItem('emp_theme', next);
}
(function() {
  const saved = localStorage.getItem('emp_theme') || 'dark';
  if (saved === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
    window.addEventListener('DOMContentLoaded', () => {
      ['themeBtnLogin','themeBtnHeader'].forEach(id => {
        const btn = document.getElementById(id);
        if (btn) btn.textContent = '☀️';
      });
    });
  }
})();

async function empLogin() {
  const name = document.getElementById('empName').value.trim();
  const pass = document.getElementById('empPass').value;
  const err = document.getElementById('empLoginError');
  if (!name||!pass) { err.textContent='Введи имя и пароль'; return; }

  const encodedName = encodeURIComponent(`name="${name}"&&active=true`);
  const data = await sb('GET','employees',null,`?filter=${encodedName}`);
  if (!data.length) { err.textContent='Неверное имя или пароль'; return; }
  const emp = data[0];
  if (String(emp.password) !== String(pass)) { err.textContent='Неверное имя или пароль'; return; }

  sessionStorage.setItem('emp_session', JSON.stringify({ id: emp.id, name: emp.name, object: emp.object }));
  enterApp(emp);
}

function enterApp(emp) {
  employee = emp;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('greetingName').textContent = emp.name;
  document.getElementById('greetingObject').textContent = emp.object.toUpperCase();
  loadMyTasks();
  checkCheckinRequest();
}

async function checkCheckinRequest() {
  try {
    const requests = await sb('GET','checkin_requests',null,
      `?employee_id=eq.${employee.id}&seen=eq.false&order=created_at.desc`);
    if (!requests.length) return;
    
    const req = requests[0];
    // Mark as seen
    await sb('PATCH','checkin_requests',{ seen: true },`?id=eq.${req.id}`);
    
    // Show banner on checkin tab
    const banner = document.createElement('div');
    banner.id = 'checkinBanner';
    banner.style.cssText = 'background:linear-gradient(135deg,#1a2a1a,#1a1a0f);border:1px solid var(--accent);border-radius:var(--radius);padding:16px;margin-bottom:16px;display:flex;align-items:center;gap:12px';
    banner.innerHTML = `
      <div style="font-size:24px">📩</div>
      <div style="flex:1">
        <div style="font-family:var(--font-head);font-size:12px;color:var(--accent);margin-bottom:4px">ЗАПРОС ОТ РУКОВОДИТЕЛЯ</div>
        <div style="font-size:14px">${req.message}</div>
      </div>
      <button onclick="goToCheckin()" style="background:var(--accent);color:#0f0f0f;border:none;border-radius:8px;padding:8px 14px;font-family:var(--font-head);font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap">Заполнить →</button>
    `;
    
    // Insert before tasks list
    const tasksList = document.getElementById('tasksList');
    tasksList.parentNode.insertBefore(banner, tasksList);
  } catch(e) {} // silently fail if table doesn't exist
}

function goToCheckin() {
  const banner = document.getElementById('checkinBanner');
  if (banner) banner.remove();
  showTab('checkin', document.querySelectorAll('.tab')[2]);
  document.getElementById('tab-checkin').scrollIntoView({ behavior: 'smooth' });
}

function empLogout() {
  sessionStorage.removeItem('emp_session');
  employee = null; allTasks = [];
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
  document.getElementById('empPass').value = '';
  document.getElementById('empLoginError').textContent = '';
}

// Auto-login if session active
window.addEventListener('DOMContentLoaded', () => {
  const saved = sessionStorage.getItem('emp_session');
  if (saved) {
    try {
      const emp = JSON.parse(saved);
      enterApp(emp);
    } catch(e) {
      sessionStorage.removeItem('emp_session');
    }
  }
});

async function loadMyTasks() {
  const el = document.getElementById('tasksList');
  el.innerHTML = '<div class="loading"><div class="spinner"></div> Загрузка...</div>';
  allTasks = await sb('GET','tasks',null,`?employee_id=eq.${employee.id}&order=deadline.asc`);
  renderTasks();
}

function renderTasks() {
  const el = document.getElementById('tasksList');
  const now = new Date();

  if (!allTasks.length) {
    el.innerHTML = `<div style="text-align:center;padding:40px;color:var(--text2)">
      <div style="font-size:36px;margin-bottom:12px">📋</div>
      <div style="font-family:var(--font-head);font-size:14px;margin-bottom:6px;color:var(--text)">Задач пока нет</div>
      <div style="font-size:13px">Руководитель добавит задачи или добавь сам</div>
    </div>`;
    return;
  }

  const sorted = [...allTasks].sort((a,b) => {
    if (a.status==='done' && b.status!=='done') return 1;
    if (a.status!=='done' && b.status==='done') return -1;
    const da=a.deadline||'9999', db=b.deadline||'9999';
    if (da!==db) return da<db?-1:1;
    return (PRIORITY_MAP[a.priority]?.order??2)-(PRIORITY_MAP[b.priority]?.order??2);
  });

  const pending = sorted.filter(t => t.status!=='done');
  const done = sorted.filter(t => t.status==='done');

  const renderList = tasks => tasks.map(t => {
    const isDone = t.status==='done';
    const isOverdue = !isDone && t.deadline && new Date(t.deadline)<now;
    const dl = t.deadline ? new Date(t.deadline+'T12:00:00').toLocaleDateString('ru',{day:'numeric',month:'short'}) : '';
    const pr = PRIORITY_MAP[t.priority] || PRIORITY_MAP.medium;

    return `<div class="task-item ${isDone?'done':''} ${isOverdue?'overdue':''}" id="task-${t.id}">
      <div class="task-header" onclick="toggleComplete('${t.id}',${isDone})">
        <div class="checkbox">${isDone?'✓':''}</div>
        <div class="task-body">
          <div class="task-title">${t.title}</div>
          <div class="task-meta">
            <span>${pr.icon} ${pr.label}</span>
            ${dl ? `<span class="task-deadline ${isOverdue?'overdue':''}">· 📅 ${dl}${isOverdue?' · просрочено':''}</span>` : ''}
            ${t.created_by==='employee' ? '<span style="color:var(--accent);font-size:11px">· моя задача</span>' : ''}
          </div>
          ${t.notes ? `<div class="task-notes">${t.notes}</div>` : ''}
        </div>
      </div>
      ${isDone && t.comment ? `<div class="done-comment">💬 ${t.comment}</div>` : ''}

      <!-- Comments thread -->
      <div class="task-comments" id="comments-${t.id}" style="display:none"></div>

      <!-- Add note button -->
      <div style="margin-top:8px;display:flex;gap:8px">
        <button class="btn ghost" style="flex:1;padding:8px;font-size:12px" onclick="toggleComments('${t.id}')">💬 Комментарий</button>
      </div>

      <!-- Complete expand -->
      ${!isDone ? `<div class="complete-expand" id="expand-${t.id}">
        <textarea placeholder="Комментарий к результату (необязательно)..." id="comment-${t.id}"></textarea>
        <div class="complete-actions">
          <button class="btn ghost" onclick="cancelExpand('${t.id}')">Отмена</button>
          <button class="btn" onclick="confirmDone('${t.id}')">Выполнено ✓</button>
        </div>
      </div>` : ''}
    </div>`;
  }).join('');

  let html = '';
  if (pending.length) {
    html += `<div style="font-size:11px;color:var(--text3);letter-spacing:1.5px;margin-bottom:12px">В РАБОТЕ — ${pending.length}</div>`;
    html += renderList(pending);
  }
  if (done.length) {
    html += `<div style="font-size:11px;color:var(--text3);letter-spacing:1.5px;margin:20px 0 12px">ВЫПОЛНЕНО — ${done.length}</div>`;
    html += renderList(done);
  }
  el.innerHTML = html;
}

function toggleComplete(id, isDone) {
  if (isDone) return;
  const expand = document.getElementById('expand-'+id);
  if (expand) expand.classList.toggle('open');
}

function cancelExpand(id) {
  document.getElementById('expand-'+id).classList.remove('open');
}

async function confirmDone(taskId) {
  const comment = document.getElementById('comment-'+taskId).value.trim();
  await sb('PATCH','tasks',{ status:'done', comment, completed_at:new Date().toISOString() },`?id=eq.${taskId}`);
  const task = allTasks.find(t => t.id===taskId);
  if (task) { task.status='done'; task.comment=comment; }
  renderTasks();
}

// Comments
async function toggleComments(taskId) {
  const el = document.getElementById('comments-'+taskId);
  if (el.style.display==='none') {
    el.style.display = 'block';
    const comments = await sb('GET','task_comments',null,`?task_id=eq.${taskId}&order=created_at.asc`);
    if (!comments.length) {
      el.innerHTML = `<div style="font-size:12px;color:var(--text3);padding:8px 0">Нет комментариев</div>
        <div class="add-note-row">
          <input type="text" id="noteInput-${taskId}" placeholder="Написать комментарий...">
          <button class="btn small-btn" onclick="submitNote('${taskId}')">→</button>
        </div>`;
    } else {
      el.innerHTML = comments.map(c => `
        <div class="task-comment-item ${c.author_role}">
          <div class="comment-who">${c.author}</div>
          <div>${c.text}</div>
        </div>`).join('') +
        `<div class="add-note-row">
          <input type="text" id="noteInput-${taskId}" placeholder="Написать комментарий...">
          <button class="btn small-btn" onclick="submitNote('${taskId}')">→</button>
        </div>`;
    }
  } else {
    el.style.display = 'none';
  }
}

async function submitNote(taskId) {
  const input = document.getElementById('noteInput-'+taskId);
  const text = input.value.trim();
  if (!text) return;
  await sb('POST','task_comments',{ task_id:taskId, author:employee.name, author_role:'employee', text });
  input.value = '';
  // Refresh comments
  const comments = await sb('GET','task_comments',null,`?task_id=eq.${taskId}&order=created_at.asc`);
  const el = document.getElementById('comments-'+taskId);
  el.innerHTML = comments.map(c => `
    <div class="task-comment-item ${c.author_role}">
      <div class="comment-who">${c.author}</div>
      <div>${c.text}</div>
    </div>`).join('') +
    `<div class="add-note-row">
      <input type="text" id="noteInput-${taskId}" placeholder="Написать комментарий...">
      <button class="btn small-btn" onclick="submitNote('${taskId}')">→</button>
    </div>`;
}

// Self-task
async function addSelfTask() {
  const title = document.getElementById('selfTaskTitle').value.trim();
  const deadline = document.getElementById('selfTaskDeadline').value;
  const priority = document.getElementById('selfTaskPriority').value;
  if (!title || !deadline) return alert('Введи название и срок');
  const month = deadline.substring(0,7);
  await sb('POST','tasks',{ employee_id:employee.id, employee_name:employee.name, title, deadline, priority, month, status:'pending', created_by:'employee' });
  document.getElementById('selfTaskTitle').value = '';
  document.getElementById('selfTaskDeadline').value = '';
  loadMyTasks();
}

// Stats
async function showStats(period, btn) {
  document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const tasks = await sb('GET','tasks',null,`?employee_id=eq.${employee.id}`);
  const now = new Date();
  let filtered;
  if (period==='week') {
    const weekAgo = new Date(now-7*24*3600*1000);
    filtered = tasks.filter(t => t.completed_at && new Date(t.completed_at)>=weekAgo);
  } else if (period==='month') {
    const m = now.toISOString().substring(0,7);
    filtered = tasks.filter(t => t.month===m);
  } else {
    filtered = tasks;
  }
  const done = filtered.filter(t => t.status==='done').length;
  const total = filtered.length;
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('statsContent').innerHTML = `
    <div class="big-stat"><div class="big-number">${done}</div><div class="big-label">задач выполнено</div></div>
    <div class="stats-row">
      <div class="stat-card"><div class="stat-num done-color">${pct}%</div><div class="stat-label">выполнено</div></div>
      <div class="stat-card"><div class="stat-num pending-color">${total-done}</div><div class="stat-label">в работе</div></div>
    </div>`;
}

// Checkin
async function submitCheckin() {
  const done = document.getElementById('ciDone').value.trim();
  const willDo = document.getElementById('ciWillDo').value.trim();
  const needHelp = document.getElementById('ciNeedHelp').value.trim();
  const msg = document.getElementById('checkinMsg');
  if (!done||!willDo) { msg.textContent='Заполни обязательные поля'; return; }
  await sb('POST','checkins',{ employee_id:employee.id, employee_name:employee.name, week_date:new Date().toISOString().substring(0,10), done, will_do:willDo, need_help:needHelp });
  msg.style.color='var(--done)';
  msg.textContent='✓ Отчёт отправлен!';
  document.getElementById('ciDone').value='';
  document.getElementById('ciWillDo').value='';
  document.getElementById('ciNeedHelp').value='';
  setTimeout(()=>{msg.textContent='';msg.style.color='';},3000);
}

// Tabs
function showTab(name, btn) {
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  ['tasks','stats','checkin','history'].forEach(t => {
    const el = document.getElementById('tab-'+t);
    if (el) el.style.display='none';
  });
  btn.classList.add('active');
  document.getElementById('tab-'+name).style.display='block';
  if (name==='stats') showStats('week', document.querySelector('.period-btn'));
  if (name==='history') loadMyCheckins();
}

async function loadMyCheckins() {
  const el = document.getElementById('myCheckinsContent');
  el.innerHTML = '<div class="loading"><div class="spinner"></div> Загрузка...</div>';

  const checkins = await sb('GET','checkins',null,
    `?employee_id=eq.${employee.id}&order=created_at.desc`);

  if (!checkins.length) {
    el.innerHTML = `<div style="text-align:center;padding:40px;color:var(--text2)">
      <div style="font-size:36px;margin-bottom:12px">📋</div>
      <div style="font-family:var(--font-head);font-size:14px;color:var(--text)">Отчётов пока нет</div>
      <div style="font-size:13px;margin-top:6px">Заполни первый отчёт во вкладке «Отчёт» ✍️</div>
    </div>`;
    return;
  }

  el.innerHTML = checkins.map(c => {
    const date = new Date(c.created_at).toLocaleDateString('ru',{day:'numeric',month:'long',year:'numeric'});
    return `<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div style="font-family:var(--font-head);font-size:11px;color:var(--accent)">${date}</div>
        <button onclick="openEditCheckin('${c.id}',\`${c.done.replace(/`/g,"'")}\`,\`${c.will_do.replace(/`/g,"'")}\`,\`${(c.need_help||'').replace(/`/g,"'")}\`)"
          style="background:none;border:1px solid var(--border);color:var(--text2);border-radius:8px;padding:5px 12px;font-size:12px;cursor:pointer">✏️ Редактировать</button>
        <button onclick="deleteCheckin('${c.id}')"
          style="background:none;border:1px solid #c94a4a44;color:#c94a4a;border-radius:8px;padding:5px 12px;font-size:12px;cursor:pointer">🗑</button>
      </div>
      <div style="margin-bottom:10px">
        <div style="font-size:11px;color:var(--text3);letter-spacing:1px;margin-bottom:4px">ЧТО СДЕЛАНО</div>
        <div style="font-size:14px;line-height:1.6">${c.done}</div>
      </div>
      <div style="margin-bottom:10px">
        <div style="font-size:11px;color:var(--text3);letter-spacing:1px;margin-bottom:4px">ПЛАНЫ</div>
        <div style="font-size:14px;line-height:1.6">${c.will_do}</div>
      </div>
      ${c.need_help ? `<div>
        <div style="font-size:11px;color:var(--text3);letter-spacing:1px;margin-bottom:4px">НУЖНА ПОМОЩЬ</div>
        <div style="font-size:14px;line-height:1.6">${c.need_help}</div>
      </div>` : ''}
    </div>`;
  }).join('');
}

function openEditCheckin(id, done, willDo, needHelp) {
  document.getElementById('editCheckinId').value = id;
  document.getElementById('editCiDone').value = done;
  document.getElementById('editCiWillDo').value = willDo;
  document.getElementById('editCiNeedHelp').value = needHelp;
  document.getElementById('modalEditCheckin').style.display = 'flex';
}

async function saveEditCheckin() {
  const id = document.getElementById('editCheckinId').value;
  const done = document.getElementById('editCiDone').value.trim();
  const will_do = document.getElementById('editCiWillDo').value.trim();
  const need_help = document.getElementById('editCiNeedHelp').value.trim();
  if (!done || !will_do) return alert('Заполни обязательные поля');
  await sb('PATCH','checkins',{ done, will_do, need_help },`?id=eq.${id}`);
  document.getElementById('modalEditCheckin').style.display = 'none';
  loadMyCheckins();
}

async function deleteCheckin(id) {
  if (!confirm('Удалить этот отчёт?')) return;
  await sb('DELETE','checkins',null,`?id=eq.${id}`);
  loadMyCheckins();
}
</script>
<!-- MODAL: Редактировать чекпоинт -->
<div id="modalEditCheckin" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:center;justify-content:center;padding:20px">
  <div style="background:#181818;border:1px solid #2a2a2a;border-radius:20px;padding:28px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto">
    <div style="font-family:var(--font-head);font-size:14px;font-weight:600;margin-bottom:20px">Редактировать отчёт</div>
    <input type="hidden" id="editCheckinId">
    <label class="form-label" style="margin-top:0">ЧТО СДЕЛАНО *</label>
    <textarea class="input" id="editCiDone" style="min-height:80px;margin-bottom:0"></textarea>
    <label class="form-label">ПЛАНЫ *</label>
    <textarea class="input" id="editCiWillDo" style="min-height:80px;margin-bottom:0"></textarea>
    <label class="form-label">ГДЕ НУЖНА ПОМОЩЬ</label>
    <textarea class="input" id="editCiNeedHelp" style="min-height:60px;margin-bottom:0"></textarea>
    <div style="display:flex;gap:10px;margin-top:20px">
      <button class="btn secondary" onclick="document.getElementById('modalEditCheckin').style.display='none'">Отмена</button>
      <button class="btn" onclick="saveEditCheckin()">Сохранить</button>
    </div>
  </div>
</div>
</body>
</html>
