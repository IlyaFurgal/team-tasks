<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Управление — Надежда</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600;700&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --accent:#c9a96e;
  --done:#3d8f5f; --pending:#3d6fb5; --danger:#c94a4a;
  --radius:12px; --font-head:'Unbounded',sans-serif; --font-body:'Golos Text',sans-serif;
  --bg:#0f0f0f; --surface:#181818; --surface2:#222222; --border:#2a2a2a;
  --text:#f0ece4; --text2:#8a8278; --text3:#5a5550;
}
[data-theme="light"] {
  --bg:#f5f0e8; --surface:#ffffff; --surface2:#f0ebe0; --border:#e0d8cc;
  --text:#1a1510; --text2:#6b5f50; --text3:#a09080;
  --done:#2d7a4f; --pending:#2d5a9e; --danger:#b03030;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100vh}

#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at 50% 30%,#1a1408 0%,#0f0f0f 70%)}
[data-theme="light"] #loginScreen{background:radial-gradient(ellipse at 50% 30%,#f0e8d0 0%,#f5f0e8 70%)}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:40px 32px;width:100%;max-width:360px;text-align:center}
.login-logo{font-family:var(--font-head);font-size:10px;letter-spacing:4px;color:var(--accent);text-transform:uppercase;margin-bottom:28px}
.login-title{font-family:var(--font-head);font-size:18px;font-weight:600;margin-bottom:6px}
.login-sub{font-size:13px;color:var(--text2);margin-bottom:28px}

.input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:var(--font-body);font-size:15px;padding:14px 16px;outline:none;transition:border-color .2s;margin-bottom:12px}
.input:focus{border-color:var(--accent)}
.input::placeholder{color:var(--text3)}
select.input{cursor:pointer}

.btn{width:100%;background:var(--accent);color:#0f0f0f;border:none;border-radius:var(--radius);font-family:var(--font-head);font-size:12px;font-weight:600;letter-spacing:1px;padding:14px;cursor:pointer;transition:opacity .2s}
.btn:hover{opacity:.9}
.btn.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn.danger{background:var(--danger);color:#fff}
.btn.small{width:auto;padding:8px 16px;font-size:11px}

.error-msg{color:var(--danger);font-size:13px;margin-top:10px;min-height:20px}
#app{display:none;min-height:100vh}

/* Header */
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:64px;position:sticky;top:0;z-index:100}
.header-brand{font-family:var(--font-head);font-size:11px;font-weight:600;letter-spacing:2px;color:var(--accent)}
.header-right{display:flex;align-items:center;gap:12px}
.header-name{font-size:13px;color:var(--text2)}
.theme-toggle{background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:16px;width:32px;height:32px;border-radius:8px;cursor:pointer}
.logout-btn{background:none;border:1px solid var(--border);color:var(--text2);font-size:12px;padding:6px 12px;border-radius:8px;cursor:pointer;font-family:var(--font-body)}
.logout-btn:hover{border-color:var(--danger);color:var(--danger)}

/* Nav tabs */
.nav-tabs{background:var(--surface);border-bottom:1px solid var(--border);display:flex;position:sticky;top:64px;z-index:99}
.nav-tab{flex:1;background:none;border:none;border-bottom:2px solid transparent;color:var(--text2);font-family:var(--font-body);font-size:13px;padding:16px 8px;cursor:pointer;transition:all .2s;text-align:center}
.nav-tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* Main */
.main{max-width:1100px;margin:0 auto;padding:28px 24px}
.section{display:none}
.section.active{display:block}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.section-title{font-family:var(--font-head);font-size:16px;font-weight:600}

/* Employee card */
.emp-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;margin-bottom:24px;display:flex;align-items:center;gap:16px}
.emp-avatar{width:48px;height:48px;border-radius:50%;background:var(--surface2);border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-size:16px;color:var(--accent);flex-shrink:0}
.emp-info-name{font-family:var(--font-head);font-size:14px;font-weight:600}
.emp-info-sub{font-size:13px;color:var(--text2);margin-top:3px}
.emp-stats{margin-left:auto;display:flex;gap:20px}
.emp-stat{text-align:center}
.emp-stat-val{font-family:var(--font-head);font-size:18px;font-weight:600;color:var(--accent)}
.emp-stat-label{font-size:11px;color:var(--text3);margin-top:2px}

/* Toolbar */
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.select{background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--font-body);font-size:13px;padding:8px 12px;outline:none;cursor:pointer}
.month-input{background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--font-body);font-size:13px;padding:8px 12px;outline:none}

/* Table */
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse}
thead th{background:var(--surface2);padding:12px 16px;text-align:left;font-family:var(--font-head);font-size:10px;letter-spacing:1px;color:var(--text3);font-weight:400;white-space:nowrap}
tbody td{padding:14px 16px;border-top:1px solid var(--border);font-size:14px;vertical-align:middle}
tbody tr:hover{background:var(--surface2)}

.status-badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;font-family:var(--font-head)}
.status-badge.done{background:rgba(61,143,95,.15);color:#4aae7b}
.status-badge.pending{background:rgba(61,111,181,.15);color:#6b9fd4}
.status-badge.overdue{background:rgba(201,74,74,.15);color:#e07070}

/* Creator badge */
.creator-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;font-family:var(--font-head);letter-spacing:.5px}
.creator-roman{background:rgba(201,169,110,.15);color:var(--accent)}
.creator-nadezda{background:rgba(61,111,181,.15);color:#6b9fd4}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:32px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
.modal-title{font-family:var(--font-head);font-size:14px;font-weight:600;margin-bottom:24px}
.form-row{margin-bottom:16px}
.form-label{display:block;font-size:12px;color:var(--text2);margin-bottom:6px;letter-spacing:.5px}
.modal-actions{display:flex;gap:10px;margin-top:24px}
.modal-actions .btn{flex:1}

/* Checkins */
.checkin-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:12px}
.checkin-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.checkin-date{font-family:var(--font-head);font-size:12px;color:var(--accent)}
.checkin-block{margin-bottom:12px}
.checkin-block-label{font-size:11px;letter-spacing:1px;color:var(--text3);text-transform:uppercase;margin-bottom:4px}
.checkin-block-text{font-size:14px;line-height:1.6;color:var(--text)}

/* Empty / loading */
.empty{text-align:center;padding:60px 20px;color:var(--text2)}
.empty-icon{font-size:40px;margin-bottom:16px}
.empty-title{font-family:var(--font-head);font-size:16px;margin-bottom:8px;color:var(--text)}
.loading{display:flex;align-items:center;justify-content:center;padding:40px;color:var(--text2);font-size:14px;gap:10px}
.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* No employee state */
.no-emp-banner{background:var(--surface);border:1px solid var(--accent);border-radius:var(--radius);padding:24px;text-align:center;margin-bottom:24px}
.no-emp-banner p{color:var(--text2);font-size:14px;line-height:1.6}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">Княже · Таёжный</div>
    <div class="login-title">Панель бухгалтера</div>
    <div class="login-sub">Надежда</div>
    <input type="text" class="input" id="loginName" placeholder="Имя" value="Надежда">
    <input type="password" class="input" id="loginPass" placeholder="Пароль" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn" onclick="doLogin()">ВОЙТИ</button>
    <div style="margin-top:16px">
      <button class="theme-toggle" onclick="toggleTheme()" style="margin:0 auto;display:block">🌙</button>
    </div>
    <div class="error-msg" id="loginError"></div>
  </div>
</div>

<div id="app">
  <header class="header">
    <div class="header-brand">Управление · Бухгалтерия</div>
    <div class="header-right">
      <span class="header-name">Надежда</span>
      <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
      <button class="logout-btn" onclick="doLogout()">Выйти</button>
    </div>
  </header>

  <div class="nav-tabs">
    <button class="nav-tab active" onclick="showTab('tasks',this)">✅ Задачи</button>
    <button class="nav-tab" onclick="showTab('checkins',this)">📋 Чекпоинты</button>
  </div>

  <main class="main">

    <!-- TASKS -->
    <div class="section active" id="section-tasks">
      <div class="section-header">
        <div class="section-title">Задачи сотрудника</div>
        <button class="btn small" onclick="openAddTaskModal()" id="addTaskBtn" style="display:none">+ Добавить задачу</button>
      </div>
      <div id="empCardWrap"></div>
      <div class="toolbar" id="tasksToolbar" style="display:none">
        <input type="month" class="month-input" id="filterMonth" onchange="loadTasks()">
        <select class="select" id="filterStatus" onchange="loadTasks()">
          <option value="">Все статусы</option>
          <option value="pending">В работе</option>
          <option value="done">Выполнено</option>
          <option value="overdue">Просрочено</option>
        </select>
      </div>
      <div id="tasksContent"></div>
    </div>

    <!-- CHECKINS -->
    <div class="section" id="section-checkins">
      <div class="section-header">
        <div class="section-title">Еженедельные отчёты</div>
        <button class="btn small" onclick="openCheckinRequestModal()" id="checkinReqBtn" style="display:none">📩 Запросить отчёт</button>
      </div>
      <div id="checkinsContent"><div class="loading"><div class="spinner"></div> Загрузка...</div></div>
    </div>

  </main>
</div>

<!-- MODAL: Задача -->
<div class="modal-overlay" id="modalTask">
  <div class="modal">
    <div class="modal-title" id="taskModalTitle">Новая задача</div>
    <input type="hidden" id="taskEditId">
    <div class="form-row"><label class="form-label">ЗАДАЧА</label><input type="text" class="input" id="taskTitle" placeholder="Описание задачи"></div>
    <div class="form-row"><label class="form-label">СРОК</label><input type="date" class="input" id="taskDeadline"></div>
    <div class="form-row">
      <label class="form-label">ПРИОРИТЕТ</label>
      <select class="input" id="taskPriority">
        <option value="critical">🔴 Критически важно</option>
        <option value="high">🟠 Важно</option>
        <option value="medium" selected>🟡 Средняя важность</option>
        <option value="low">🟢 Малая важность</option>
      </select>
    </div>
    <div class="form-row"><label class="form-label">ЗАМЕТКА</label><input type="text" class="input" id="taskNotes" placeholder="Необязательно"></div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal('modalTask')">Отмена</button>
      <button class="btn" id="taskSaveBtn" onclick="submitTask()">Добавить</button>
    </div>
  </div>
</div>

<!-- MODAL: Запрос чекпоинта -->
<div class="modal-overlay" id="modalCheckinReq">
  <div class="modal">
    <div class="modal-title">Запросить отчёт</div>
    <div class="form-row"><label class="form-label">СООБЩЕНИЕ</label><input type="text" class="input" id="checkinMsg" placeholder="Заполни еженедельный отчёт"></div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal('modalCheckinReq')">Отмена</button>
      <button class="btn" onclick="sendCheckinRequest()">Отправить</button>
    </div>
  </div>
</div>

<script>
const PB_URL = 'http://155.212.185.139:8090';
const MANAGER_NAME = 'Надежда';
const MANAGER_PASSWORD = '1234';
const CREATED_BY = 'nadezda';

const PRIORITY = {
  critical:{ label:'🔴 Критически', color:'#c94a4a', order:0 },
  high:    { label:'🟠 Важно',      color:'#c97b3a', order:1 },
  medium:  { label:'🟡 Средняя',    color:'#c9a96e', order:2 },
  low:     { label:'🟢 Малая',      color:'#4a9e6b', order:3 },
};

let managedEmployee = null; // сотрудник под управлением Надежды

// ===== API =====
async function pb(method, table, body=null, filter='') {
  let url = PB_URL + '/api/collections/' + table + '/records';
  if (method === 'GET') {
    const params = filter ? `?${filter}&perPage=500` : '?perPage=500';
    let page = 1, all = [];
    while (true) {
      const res = await fetch(url + params + '&page=' + page);
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || 'DB error');
      all = all.concat(data.items || []);
      if (page >= (data.totalPages||1) || !data.items?.length) break;
      page++;
    }
    return all;
  }
  if (method === 'POST') {
    const res = await fetch(url, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || 'DB error');
    return data;
  }
  if (method === 'PATCH') {
    const idMatch = filter.match(/id="([^"]+)"/);
    if (idMatch) url += '/' + idMatch[1];
    const res = await fetch(url, {method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if (!res.ok) { const d = await res.json(); throw new Error(d.message||'DB error'); }
    return await res.json();
  }
  if (method === 'DELETE') {
    const idMatch = filter.match(/id="([^"]+)"/);
    if (idMatch) url += '/' + idMatch[1];
    await fetch(url, {method:'DELETE'});
    return {ok:true};
  }
}

// ===== AUTH =====
function doLogin() {
  const name = document.getElementById('loginName').value.trim();
  const pass = document.getElementById('loginPass').value;
  const err = document.getElementById('loginError');
  if (name === MANAGER_NAME && pass === MANAGER_PASSWORD) {
    err.textContent = '';
    sessionStorage.setItem('mgr_auth','1');
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    initApp();
  } else {
    err.textContent = 'Неверное имя или пароль';
  }
}

function doLogout() {
  sessionStorage.removeItem('mgr_auth');
  location.reload();
}

// ===== INIT =====
async function initApp() {
  // Устанавливаем текущий месяц
  const now = new Date();
  document.getElementById('filterMonth').value = now.toISOString().substring(0,7);
  // Загружаем сотрудника под управлением (object содержит 'бухгалтерия' или managed_by='nadezda')
  await loadManagedEmployee();
}

async function loadManagedEmployee() {
  try {
    // Ищем сотрудника у которого object содержит 'Надежда' или специальный маркер
    const all = await pb('GET', 'employees', null, 'filter=active%3Dtrue');
    // Ищем сотрудника с маркером managed_by надежды — object содержит "[НБ]"
    managedEmployee = all.find(e => e.object && e.object.includes('[НБ]'));
    renderEmpCard();
    if (managedEmployee) {
      document.getElementById('addTaskBtn').style.display = '';
      document.getElementById('tasksToolbar').style.display = 'flex';
      document.getElementById('checkinReqBtn').style.display = '';
      loadTasks();
      loadCheckins();
    }
  } catch(e) {
    console.error(e);
  }
}

function renderEmpCard() {
  const wrap = document.getElementById('empCardWrap');
  if (!managedEmployee) {
    wrap.innerHTML = `<div class="no-emp-banner">
      <div style="font-size:32px;margin-bottom:12px">👤</div>
      <div style="font-family:var(--font-head);font-size:13px;margin-bottom:8px">Сотрудник не назначен</div>
      <p>Роман должен добавить сотрудника и указать в поле «Объект» маркер <strong>[НБ]</strong> — тогда она появится здесь автоматически.</p>
    </div>`;
    document.getElementById('tasksContent').innerHTML = '';
    return;
  }
  wrap.innerHTML = `<div class="emp-card">
    <div class="emp-avatar">${managedEmployee.name.charAt(0)}</div>
    <div>
      <div class="emp-info-name">${managedEmployee.name}</div>
      <div class="emp-info-sub">${managedEmployee.object?.replace('[НБ]','').trim() || '—'}</div>
    </div>
    <div class="emp-stats" id="empStats"></div>
  </div>`;
}

// ===== TASKS =====
async function loadTasks() {
  if (!managedEmployee) return;
  const el = document.getElementById('tasksContent');
  el.innerHTML = '<div class="loading"><div class="spinner"></div> Загрузка...</div>';
  try {
    const month = document.getElementById('filterMonth').value;
    const statusFilter = document.getElementById('filterStatus').value;
    let filter = `filter=employee_id%3D"${managedEmployee.id}"`;
    if (month) filter += `%26%26month%3D"${month}"`;
    const allTasks = await pb('GET', 'tasks', null, filter);
    const today = new Date().toISOString().substring(0,10);
    let tasks = allTasks.map(t => ({...t, isOverdue: t.status!=='done' && t.deadline && t.deadline < today}));
    if (statusFilter === 'done') tasks = tasks.filter(t => t.status==='done');
    else if (statusFilter === 'pending') tasks = tasks.filter(t => t.status!=='done' && !t.isOverdue);
    else if (statusFilter === 'overdue') tasks = tasks.filter(t => t.isOverdue);
    // Обновим статистику
    const allForStats = await pb('GET', 'tasks', null, `filter=employee_id%3D"${managedEmployee.id}"%26%26month%3D"${month}"`);
    const doneCount = allForStats.filter(t => t.status==='done').length;
    const statsEl = document.getElementById('empStats');
    if (statsEl) statsEl.innerHTML = `
      <div class="emp-stat"><div class="emp-stat-val">${allForStats.length}</div><div class="emp-stat-label">Задач</div></div>
      <div class="emp-stat"><div class="emp-stat-val">${doneCount}</div><div class="emp-stat-label">Выполнено</div></div>
      <div class="emp-stat"><div class="emp-stat-val">${allForStats.length ? Math.round(doneCount/allForStats.length*100) : 0}%</div><div class="emp-stat-label">Прогресс</div></div>
    `;
    if (!tasks.length) {
      el.innerHTML = `<div class="empty"><div class="empty-icon">📋</div><div class="empty-title">Задач нет</div><div>Добавь задачу через кнопку выше</div></div>`;
      return;
    }
    tasks.sort((a,b) => {
      if (a.status==='done' && b.status!=='done') return 1;
      if (a.status!=='done' && b.status==='done') return -1;
      return (a.deadline||'9999') < (b.deadline||'9999') ? -1 : 1;
    });
    el.innerHTML = `<div class="table-wrap"><table>
      <thead><tr><th>ЗАДАЧА</th><th>ПРИОРИТЕТ</th><th>СРОК</th><th>СТАТУС</th><th>ОТ КОГО</th><th>КОММЕНТАРИЙ</th><th></th></tr></thead>
      <tbody>${tasks.map(t => {
        const badge = t.status==='done' ? 'done' : t.isOverdue ? 'overdue' : 'pending';
        const label = t.status==='done' ? 'Выполнено' : t.isOverdue ? 'Просрочено' : 'В работе';
        const dl = t.deadline ? new Date(t.deadline+'T12:00:00').toLocaleDateString('ru',{day:'numeric',month:'short'}) : '—';
        const pr = PRIORITY[t.priority] || PRIORITY.medium;
        const creatorBadge = t.created_by === 'nadezda'
          ? `<span class="creator-badge creator-nadezda">Надежда</span>`
          : `<span class="creator-badge creator-roman">Роман</span>`;
        return `<tr style="${t.status==='done'?'opacity:.65':''}">
          <td><div style="font-weight:500">${t.title}</div>${t.notes?`<div style="font-size:12px;color:var(--text2);margin-top:2px">${t.notes}</div>`:''}</td>
          <td><span style="font-size:12px;color:${pr.color}">${pr.label}</span></td>
          <td style="color:${t.isOverdue?'var(--danger)':'var(--text2)'};white-space:nowrap">${dl}</td>
          <td><span class="status-badge ${badge}">${label}</span></td>
          <td>${creatorBadge}</td>
          <td>${t.comment?`<span style="font-size:13px;color:var(--text2);font-style:italic">${t.comment}</span>`:'<span style="color:var(--text3);font-size:12px">—</span>'}</td>
          <td style="white-space:nowrap">
            <button class="btn small secondary" style="margin-right:4px" onclick="openEditTask('${t.id}')">✏️</button>
            <button class="btn small danger" onclick="deleteTask('${t.id}')">🗑</button>
          </td>
        </tr>`;
      }).join('')}</tbody></table></div>`;
  } catch(e) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-title">Ошибка</div><div>${e.message}</div></div>`;
  }
}

function openAddTaskModal() {
  document.getElementById('taskModalTitle').textContent = 'Новая задача';
  document.getElementById('taskEditId').value = '';
  document.getElementById('taskTitle').value = '';
  document.getElementById('taskDeadline').value = '';
  document.getElementById('taskPriority').value = 'medium';
  document.getElementById('taskNotes').value = '';
  document.getElementById('taskSaveBtn').textContent = 'Добавить';
  openModal('modalTask');
}

async function openEditTask(taskId) {
  const tasks = await pb('GET', 'tasks', null, `filter=id%3D"${taskId}"`);
  const t = tasks[0]; if (!t) return;
  document.getElementById('taskModalTitle').textContent = 'Редактировать задачу';
  document.getElementById('taskEditId').value = t.id;
  document.getElementById('taskTitle').value = t.title;
  document.getElementById('taskDeadline').value = t.deadline||'';
  document.getElementById('taskPriority').value = t.priority||'medium';
  document.getElementById('taskNotes').value = t.notes||'';
  document.getElementById('taskSaveBtn').textContent = 'Сохранить';
  openModal('modalTask');
}

async function submitTask() {
  const editId = document.getElementById('taskEditId').value;
  const title = document.getElementById('taskTitle').value.trim();
  const deadline = document.getElementById('taskDeadline').value;
  const priority = document.getElementById('taskPriority').value;
  const notes = document.getElementById('taskNotes').value.trim();
  if (!title || !deadline) return alert('Заполни название и срок');
  const month = deadline.substring(0,7);
  if (editId) {
    await pb('PATCH', 'tasks', {title,deadline,priority,notes,month}, `id="${editId}"`);
  } else {
    await pb('POST', 'tasks', {
      employee_id: managedEmployee.id,
      employee_name: managedEmployee.name,
      title, deadline, priority, notes, month,
      status: 'pending',
      created_by: CREATED_BY
    });
  }
  closeModal('modalTask');
  loadTasks();
}

async function deleteTask(taskId) {
  if (!confirm('Удалить задачу?')) return;
  await pb('DELETE', 'tasks', null, `id="${taskId}"`);
  loadTasks();
}

// ===== CHECKINS =====
async function loadCheckins() {
  if (!managedEmployee) return;
  const el = document.getElementById('checkinsContent');
  el.innerHTML = '<div class="loading"><div class="spinner"></div> Загрузка...</div>';
  try {
    const checkins = await pb('GET', 'checkins', null, `filter=employee_id%3D"${managedEmployee.id}"&sort=-week_date`);
    if (!checkins.length) {
      el.innerHTML = `<div class="empty"><div class="empty-icon">📋</div><div class="empty-title">Отчётов пока нет</div></div>`;
      return;
    }
    el.innerHTML = checkins.map(c => {
      const date = c.week_date ? new Date(c.week_date+'T12:00:00').toLocaleDateString('ru',{day:'numeric',month:'long',year:'numeric'}) : '—';
      return `<div class="checkin-card">
        <div class="checkin-header">
          <div class="checkin-date">${date}</div>
          <div style="font-size:12px;color:var(--text2)">${managedEmployee.name}</div>
        </div>
        <div class="checkin-block"><div class="checkin-block-label">Что сделано</div><div class="checkin-block-text">${c.done||'—'}</div></div>
        <div class="checkin-block"><div class="checkin-block-label">Что планирую</div><div class="checkin-block-text">${c.will_do||'—'}</div></div>
        <div class="checkin-block"><div class="checkin-block-label">Нужна помощь</div><div class="checkin-block-text">${c.need_help||'—'}</div></div>
      </div>`;
    }).join('');
  } catch(e) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-title">Ошибка</div><div>${e.message}</div></div>`;
  }
}

function openCheckinRequestModal() {
  document.getElementById('checkinMsg').value = 'Заполни, пожалуйста, еженедельный отчёт';
  openModal('modalCheckinReq');
}

async function sendCheckinRequest() {
  if (!managedEmployee) return;
  const msg = document.getElementById('checkinMsg').value.trim();
  await pb('POST', 'checkin_requests', {
    employee_id: managedEmployee.id,
    message: msg,
    seen: false
  });
  closeModal('modalCheckinReq');
  alert('✅ Запрос отправлен');
}

// ===== UI =====
function showTab(name, btn) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
  document.getElementById('section-'+name).classList.add('active');
  btn.classList.add('active');
  if (name === 'checkins') loadCheckins();
  if (name === 'tasks') loadTasks();
}

function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  const icon = next === 'light' ? '☀️' : '🌙';
  document.querySelectorAll('.theme-toggle').forEach(b => b.textContent = icon);
  localStorage.setItem('theme', next);
}

// Init theme
const savedTheme = localStorage.getItem('theme') || 'dark';
document.documentElement.setAttribute('data-theme', savedTheme);
document.querySelectorAll('.theme-toggle').forEach(b => b.textContent = savedTheme === 'light' ? '☀️' : '🌙');

// Check session
if (sessionStorage.getItem('mgr_auth')) {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  initApp();
}
</script>
