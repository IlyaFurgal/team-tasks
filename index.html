<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Управление командой</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600;700&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #181818;
    --surface2: #222222;
    --border: #2a2a2a;
    --accent: #c9a96e;
    --accent2: #8b6914;
    --text: #f0ece4;
    --text2: #8a8278;
    --text3: #5a5550;
    --done: #4a9e6b;
    --warn: #c97b3a;
    --danger: #c94a4a;
    --pending: #4a7ec9;
    --radius: 12px;
    --font-head: 'Unbounded', sans-serif;
    --font-body: 'Golos Text', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
  }

  /* ---- LOGIN ---- */
  #loginScreen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at 30% 40%, #1a1408 0%, #0f0f0f 70%);
  }

  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 48px 40px;
    width: 360px;
    text-align: center;
  }

  .login-logo {
    font-family: var(--font-head);
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 32px;
  }

  .login-title {
    font-family: var(--font-head);
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .login-sub {
    color: var(--text2);
    font-size: 14px;
    margin-bottom: 32px;
  }

  .input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 15px;
    padding: 14px 16px;
    outline: none;
    transition: border-color 0.2s;
    margin-bottom: 12px;
  }

  .input:focus { border-color: var(--accent); }
  .input::placeholder { color: var(--text3); }

  .btn {
    width: 100%;
    background: var(--accent);
    color: #0f0f0f;
    border: none;
    border-radius: var(--radius);
    font-family: var(--font-head);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    padding: 14px;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
  }

  .btn:hover { opacity: 0.9; }
  .btn:active { transform: scale(0.98); }
  .btn.secondary {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    margin-top: 8px;
  }
  .btn.danger { background: var(--danger); color: #fff; }
  .btn.small {
    width: auto;
    padding: 8px 16px;
    font-size: 11px;
  }

  .error-msg {
    color: var(--danger);
    font-size: 13px;
    margin-top: 10px;
    min-height: 20px;
  }

  /* ---- APP ---- */
  #app { display: none; }

  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-brand {
    font-family: var(--font-head);
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--accent);
    text-transform: uppercase;
  }

  .nav {
    display: flex;
    gap: 4px;
  }

  .nav-btn {
    background: none;
    border: none;
    color: var(--text2);
    font-family: var(--font-body);
    font-size: 14px;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .nav-btn:hover { color: var(--text); background: var(--surface2); }
  .nav-btn.active { color: var(--accent); background: var(--surface2); }

  .logout-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text2);
    font-family: var(--font-body);
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .logout-btn:hover { color: var(--text); border-color: var(--text3); }

  .main { padding: 32px 24px; max-width: 1100px; margin: 0 auto; }

  /* ---- SECTION ---- */
  .section { display: none; }
  .section.active { display: block; }

  .section-title {
    font-family: var(--font-head);
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 24px;
  }

  /* ---- DASHBOARD ---- */
  .dashboard-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
  }

  .emp-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    cursor: pointer;
    transition: border-color 0.2s, transform 0.2s;
    position: relative;
    overflow: hidden;
  }

  .emp-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--accent);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .emp-card:hover { border-color: var(--accent2); transform: translateY(-2px); }
  .emp-card:hover::before { opacity: 1; }

  .emp-name {
    font-family: var(--font-head);
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .emp-object {
    font-size: 12px;
    color: var(--text2);
    margin-bottom: 16px;
  }

  .progress-bar {
    height: 6px;
    background: var(--surface2);
    border-radius: 3px;
    margin-bottom: 12px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--done), #6dc98a);
    border-radius: 3px;
    transition: width 0.5s ease;
  }

  .task-stats {
    display: flex;
    gap: 12px;
  }

  .stat-pill {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 20px;
    font-weight: 500;
  }

  .stat-pill.done { background: rgba(74,158,107,0.15); color: var(--done); }
  .stat-pill.pending { background: rgba(74,126,201,0.15); color: var(--pending); }
  .stat-pill.overdue { background: rgba(201,74,74,0.15); color: var(--danger); }

  .month-selector {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }

  .month-label {
    font-family: var(--font-head);
    font-size: 12px;
    letter-spacing: 1px;
    color: var(--text2);
  }

  .month-input {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
    padding: 8px 12px;
    outline: none;
  }

  .month-input:focus { border-color: var(--accent); }

  /* ---- TASKS TABLE ---- */
  .tasks-toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .select {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
    padding: 8px 12px;
    outline: none;
    cursor: pointer;
  }

  .select:focus { border-color: var(--accent); }

  .table-wrap { overflow-x: auto; }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  th {
    text-align: left;
    font-family: var(--font-head);
    font-size: 10px;
    letter-spacing: 1.5px;
    color: var(--text2);
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  td {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    vertical-align: middle;
  }

  tr:hover td { background: var(--surface2); }

  .status-badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
  }

  .status-badge.done { background: rgba(74,158,107,0.15); color: var(--done); }
  .status-badge.pending { background: rgba(74,126,201,0.15); color: var(--pending); }
  .status-badge.overdue { background: rgba(201,74,74,0.15); color: var(--danger); }

  .comment-text {
    color: var(--text2);
    font-size: 13px;
    font-style: italic;
    max-width: 200px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ---- MODAL ---- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }

  .modal-overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px;
    width: 460px;
    max-width: calc(100vw - 32px);
    max-height: 90vh;
    overflow-y: auto;
    transform: translateY(20px);
    transition: transform 0.2s;
  }

  .modal-overlay.open .modal { transform: translateY(0); }

  .modal-title {
    font-family: var(--font-head);
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 24px;
  }

  .form-row { margin-bottom: 16px; }

  .form-label {
    display: block;
    font-size: 12px;
    color: var(--text2);
    margin-bottom: 6px;
    letter-spacing: 0.5px;
  }

  textarea.input {
    resize: vertical;
    min-height: 80px;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 24px;
  }

  .modal-actions .btn { flex: 1; }

  /* ---- EMPLOYEES SECTION ---- */
  .emp-list {
    display: grid;
    gap: 12px;
  }

  .emp-row {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .emp-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--surface2);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-head);
    font-size: 14px;
    color: var(--accent);
    flex-shrink: 0;
  }

  .emp-info { flex: 1; }
  .emp-row-name { font-size: 15px; font-weight: 600; }
  .emp-row-object { font-size: 13px; color: var(--text2); margin-top: 2px; }

  .emp-actions { display: flex; gap: 8px; }

  /* ---- CHECKINS ---- */
  .checkin-list { display: grid; gap: 12px; }

  .checkin-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
  }

  .checkin-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .checkin-who {
    font-family: var(--font-head);
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
  }

  .checkin-date { font-size: 13px; color: var(--text2); }

  .checkin-block { margin-bottom: 12px; }
  .checkin-block-label {
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--text3);
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .checkin-block-text { font-size: 14px; line-height: 1.6; }

  /* ---- EMPTY STATE ---- */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text2);
  }

  .empty-icon { font-size: 40px; margin-bottom: 16px; }
  .empty-title { font-family: var(--font-head); font-size: 16px; margin-bottom: 8px; color: var(--text); }
  .empty-sub { font-size: 14px; }

  /* ---- LOADING ---- */
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
    color: var(--text2);
    font-size: 14px;
    gap: 10px;
  }

  .spinner {
    width: 18px;
    height: 18px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 600px) {
    .main { padding: 20px 16px; }
    .nav-btn span { display: none; }
    .dashboard-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">Княже · Таёжный</div>
    <div class="login-title">Панель управления</div>
    <div class="login-sub">Доступ только для руководителя</div>
    <input type="password" class="input" id="adminPass" placeholder="Пароль" onkeydown="if(event.key==='Enter')adminLogin()">
    <button class="btn" onclick="adminLogin()">ВОЙТИ</button>
    <div class="error-msg" id="loginError"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header class="header">
    <div class="header-brand">Управление командой</div>
    <nav class="nav">
      <button class="nav-btn active" onclick="showSection('dashboard', this)">📊 <span>Дашборд</span></button>
      <button class="nav-btn" onclick="showSection('tasks', this)">✅ <span>Задачи</span></button>
      <button class="nav-btn" onclick="showSection('checkins', this)">📋 <span>Чекпоинты</span></button>
      <button class="nav-btn" onclick="showSection('employees', this)">👥 <span>Команда</span></button>
    </nav>
    <button class="logout-btn" onclick="logout()">Выйти</button>
  </header>

  <main class="main">

    <!-- DASHBOARD -->
    <div class="section active" id="section-dashboard">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; flex-wrap:gap">
        <div class="section-title" style="margin-bottom:0">Обзор команды</div>
        <div class="month-selector">
          <span class="month-label">МЕСЯЦ</span>
          <input type="month" class="month-input" id="dashMonth" onchange="loadDashboard()">
        </div>
      </div>
      <div id="dashboardContent">
        <div class="loading"><div class="spinner"></div> Загрузка...</div>
      </div>
    </div>

    <!-- TASKS -->
    <div class="section" id="section-tasks">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; flex-wrap:wrap; gap:12px">
        <div class="section-title" style="margin-bottom:0">Все задачи</div>
        <button class="btn small" onclick="openAddTaskModal()">+ Добавить задачу</button>
      </div>
      <div class="tasks-toolbar">
        <select class="select" id="filterEmployee" onchange="loadTasks()">
          <option value="">Все сотрудники</option>
        </select>
        <input type="month" class="month-input" id="filterMonth" onchange="loadTasks()">
        <select class="select" id="filterStatus" onchange="loadTasks()">
          <option value="">Все статусы</option>
          <option value="pending">Не выполнено</option>
          <option value="done">Выполнено</option>
          <option value="overdue">Просрочено</option>
        </select>
      </div>
      <div id="tasksContent">
        <div class="loading"><div class="spinner"></div> Загрузка...</div>
      </div>
    </div>

    <!-- CHECKINS -->
    <div class="section" id="section-checkins">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; flex-wrap:wrap; gap:12px">
        <div class="section-title" style="margin-bottom:0">Еженедельные отчёты</div>
        <select class="select" id="filterCheckinEmployee" onchange="loadCheckins()">
          <option value="">Все сотрудники</option>
        </select>
      </div>
      <div id="checkinsContent">
        <div class="loading"><div class="spinner"></div> Загрузка...</div>
      </div>
    </div>

    <!-- EMPLOYEES -->
    <div class="section" id="section-employees">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:24px">
        <div class="section-title" style="margin-bottom:0">Команда</div>
        <button class="btn small" onclick="openAddEmployeeModal()">+ Добавить</button>
      </div>
      <div id="employeesContent">
        <div class="loading"><div class="spinner"></div> Загрузка...</div>
      </div>
    </div>

  </main>
</div>

<!-- MODAL: Добавить задачу -->
<div class="modal-overlay" id="modalTask">
  <div class="modal">
    <div class="modal-title">Новая задача</div>
    <div class="form-row">
      <label class="form-label">Сотрудник</label>
      <select class="input" id="taskEmployee"></select>
    </div>
    <div class="form-row">
      <label class="form-label">Задача</label>
      <input type="text" class="input" id="taskTitle" placeholder="Описание задачи">
    </div>
    <div class="form-row">
      <label class="form-label">Срок выполнения</label>
      <input type="date" class="input" id="taskDeadline">
    </div>
    <div class="form-row">
      <label class="form-label">Приоритет</label>
      <select class="input" id="taskPriority">
        <option value="critical">🔴 Критически важно</option>
        <option value="high">🟠 Важно</option>
        <option value="medium" selected>🟡 Средней важности</option>
        <option value="low">🟢 Малой важности</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal('modalTask')">Отмена</button>
      <button class="btn" onclick="submitTask()">Добавить</button>
    </div>
  </div>
</div>

<!-- MODAL: Редактировать задачу -->
<div class="modal-overlay" id="modalEditTask">
  <div class="modal">
    <div class="modal-title">Редактировать задачу</div>
    <input type="hidden" id="editTaskId">
    <div class="form-row">
      <label class="form-label">Сотрудник</label>
      <input type="text" class="input" id="editTaskEmployee" disabled style="opacity:0.5">
    </div>
    <div class="form-row">
      <label class="form-label">Задача</label>
      <input type="text" class="input" id="editTaskTitle" placeholder="Описание задачи">
    </div>
    <div class="form-row">
      <label class="form-label">Срок выполнения</label>
      <input type="date" class="input" id="editTaskDeadline">
    </div>
    <div class="form-row">
      <label class="form-label">Приоритет</label>
      <select class="input" id="editTaskPriority">
        <option value="critical">🔴 Критически важно</option>
        <option value="high">🟠 Важно</option>
        <option value="medium">🟡 Средней важности</option>
        <option value="low">🟢 Малой важности</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal('modalEditTask')">Отмена</button>
      <button class="btn" onclick="submitEditTask()">Сохранить</button>
    </div>
  </div>
</div>

<!-- MODAL: Добавить сотрудника -->
<div class="modal-overlay" id="modalEmployee">
  <div class="modal">
    <div class="modal-title" id="empModalTitle">Новый сотрудник</div>
    <input type="hidden" id="empEditId">
    <div class="form-row">
      <label class="form-label">Имя</label>
      <input type="text" class="input" id="empName" placeholder="Имя сотрудника">
    </div>
    <div class="form-row">
      <label class="form-label">Пароль для входа</label>
      <input type="text" class="input" id="empPassword" placeholder="Придумай пароль">
    </div>
    <div class="form-row">
      <label class="form-label">Объект</label>
      <select class="input" id="empObject">
        <option value="Княже">Княже</option>
        <option value="Таёжный">Таёжный</option>
        <option value="Оба">Оба объекта</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal('modalEmployee')">Отмена</button>
      <button class="btn" id="empSaveBtn" onclick="submitEmployee()">Добавить</button>
    </div>
  </div>
</div>

<script>
// ============================================
// CONFIG — замени на свой URL после деплоя
// ============================================
const API_URL = 'https://script.google.com/macros/s/AKfycbyqi1GoXBQgsoOFQBXRV0-tKuXZnB5UERj650Z9lDvsep0XFmO32u3AIDx3pWyubT9mPg/exec';

// ============================================
// STATE
// ============================================
let employees = [];
let currentMonth = new Date().toISOString().substring(0, 7);

// ============================================
// AUTH
// ============================================
function adminLogin() {
  const pass = document.getElementById('adminPass').value;
  const err = document.getElementById('loginError');
  
  // Локальная проверка пароля (можно вынести в API)
  api('adminLogin', { password: pass }).then(res => {
    if (res.ok) {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      init();
    } else {
      err.textContent = 'Неверный пароль';
    }
  });
}

function logout() {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
  document.getElementById('adminPass').value = '';
}

// ============================================
// INIT
// ============================================
function init() {
  const monthInput = document.getElementById('dashMonth');
  const filterMonth = document.getElementById('filterMonth');
  monthInput.value = currentMonth;
  filterMonth.value = currentMonth;

  loadEmployees().then(() => {
    loadDashboard();
    loadTasks();
    loadCheckins();
  });
}

// ============================================
// API
// ============================================
async function api(action, data = {}) {
  const res = await fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify({ action, ...data })
  });
  return res.json();
}

// ============================================
// EMPLOYEES
// ============================================
async function loadEmployees() {
  const res = await api('getEmployees');
  if (res.ok) {
    employees = res.employees;
    renderEmployeeSelects();
    renderEmployeesList();
  }
}

function renderEmployeeSelects() {
  const selects = ['filterEmployee', 'filterCheckinEmployee', 'taskEmployee'];
  selects.forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    const isFilter = id !== 'taskEmployee';
    el.innerHTML = isFilter ? '<option value="">Все сотрудники</option>' : '';
    employees.forEach(e => {
      el.innerHTML += `<option value="${e.id}">${e.name} (${e.object})</option>`;
    });
  });
}

function renderEmployeesList() {
  const el = document.getElementById('employeesContent');
  if (!employees.length) {
    el.innerHTML = emptyState('👥', 'Нет сотрудников', 'Добавь первого сотрудника');
    return;
  }

  el.innerHTML = `<div class="emp-list">${employees.map(e => `
    <div class="emp-row">
      <div class="emp-avatar">${e.name[0]}</div>
      <div class="emp-info">
        <div class="emp-row-name">${e.name}</div>
        <div class="emp-row-object">${e.object}</div>
      </div>
      <div class="emp-actions">
        <button class="btn small secondary" onclick="openEditEmployeeModal('${e.id}', '${e.name}', '${e.object}')">Редактировать</button>
        <button class="btn small danger" onclick="deactivateEmployee('${e.id}', '${e.name}')">Удалить</button>
      </div>
    </div>
  `).join('')}</div>`;
}

function openAddEmployeeModal() {
  document.getElementById('empModalTitle').textContent = 'Новый сотрудник';
  document.getElementById('empEditId').value = '';
  document.getElementById('empName').value = '';
  document.getElementById('empPassword').value = '';
  document.getElementById('empObject').value = 'Княже';
  document.getElementById('empSaveBtn').textContent = 'Добавить';
  openModal('modalEmployee');
}

function openEditEmployeeModal(id, name, object) {
  document.getElementById('empModalTitle').textContent = 'Редактировать сотрудника';
  document.getElementById('empEditId').value = id;
  document.getElementById('empName').value = name;
  document.getElementById('empPassword').value = '';
  document.getElementById('empObject').value = object;
  document.getElementById('empSaveBtn').textContent = 'Сохранить';
  openModal('modalEmployee');
}

async function submitEmployee() {
  const id = document.getElementById('empEditId').value;
  const name = document.getElementById('empName').value.trim();
  const password = document.getElementById('empPassword').value.trim();
  const object = document.getElementById('empObject').value;

  if (!name) return alert('Введи имя');

  if (id) {
    const data = { id, name, object };
    if (password) data.password = password;
    await api('updateEmployee', data);
  } else {
    if (!password) return alert('Введи пароль');
    await api('addEmployee', { name, password, object });
  }

  closeModal('modalEmployee');
  loadEmployees();
}

async function deactivateEmployee(id, name) {
  if (!confirm(`Удалить ${name}?`)) return;
  await api('deactivateEmployee', { id });
  loadEmployees();
}

// ============================================
// DASHBOARD
// ============================================
async function loadDashboard() {
  const month = document.getElementById('dashMonth').value;
  const el = document.getElementById('dashboardContent');
  el.innerHTML = '<div class="loading"><div class="spinner"></div> Загрузка...</div>';

  const res = await api('getDashboard');
  if (!res.ok) return;

  const { stats } = res;

  if (!stats.length) {
    el.innerHTML = emptyState('📊', 'Нет данных', 'Добавь сотрудников и задачи');
    return;
  }

  const totalTasks = stats.reduce((s, e) => s + e.total, 0);
  const totalDone = stats.reduce((s, e) => s + e.done, 0);
  const totalOverdue = stats.reduce((s, e) => s + e.overdue, 0);

  el.innerHTML = `
    <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:24px">
      ${summaryCard('Всего задач', totalTasks, '📋')}
      ${summaryCard('Выполнено', totalDone, '✅')}
      ${summaryCard('Просрочено', totalOverdue, '⚠️', totalOverdue > 0 ? 'var(--danger)' : null)}
    </div>
    <div class="dashboard-grid">
      ${stats.map(emp => {
        const pct = emp.total ? Math.round(emp.done / emp.total * 100) : 0;
        return `
        <div class="emp-card" onclick="showTasksFor('${emp.id}')">
          <div class="emp-name">${emp.name}</div>
          <div class="emp-object">${emp.object}</div>
          <div class="progress-bar">
            <div class="progress-fill" style="width:${pct}%"></div>
          </div>
          <div style="display:flex; justify-content:space-between; align-items:center">
            <div class="task-stats">
              <span class="stat-pill done">${emp.done} выполнено</span>
              ${emp.pending ? `<span class="stat-pill pending">${emp.pending} в работе</span>` : ''}
              ${emp.overdue ? `<span class="stat-pill overdue">${emp.overdue} просрочено</span>` : ''}
            </div>
            <span style="font-size:12px; color:var(--text2)">${pct}%</span>
          </div>
        </div>`;
      }).join('')}
    </div>`;
}

function summaryCard(label, value, icon, color) {
  return `
    <div style="background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 20px">
      <div style="font-size:24px; margin-bottom:8px">${icon}</div>
      <div style="font-family:var(--font-head); font-size:28px; font-weight:700; color:${color || 'var(--text)'}; margin-bottom:4px">${value}</div>
      <div style="font-size:13px; color:var(--text2)">${label}</div>
    </div>`;
}

function showTasksFor(empId) {
  document.getElementById('filterEmployee').value = empId;
  showSection('tasks', document.querySelectorAll('.nav-btn')[1]);
  loadTasks();
}

// ============================================
// TASKS
// ============================================
async function loadTasks() {
  const empId = document.getElementById('filterEmployee').value;
  const month = document.getElementById('filterMonth').value;
  const status = document.getElementById('filterStatus').value;
  const el = document.getElementById('tasksContent');
  
  el.innerHTML = '<div class="loading"><div class="spinner"></div> Загрузка...</div>';

  const params = {};
  if (empId) params.employeeId = empId;
  if (month) params.month = month;

  const res = await api('getTasks', params);
  if (!res.ok) return;

  let tasks = res.tasks;
  const now = new Date();

  // Добавляем статус overdue
  tasks = tasks.map(t => ({
    ...t,
    isOverdue: t.status !== 'done' && t.deadline && new Date(t.deadline) < now
  }));

  // Фильтр по статусу
  if (status === 'done') tasks = tasks.filter(t => t.status === 'done');
  else if (status === 'pending') tasks = tasks.filter(t => t.status !== 'done' && !t.isOverdue);
  else if (status === 'overdue') tasks = tasks.filter(t => t.isOverdue);

  if (!tasks.length) {
    el.innerHTML = emptyState('✅', 'Задач нет', 'Добавь задачу через кнопку выше');
    return;
  }

  // Sort: done first, then by deadline, then by priority
  tasks.sort((a, b) => {
    if (a.status === 'done' && b.status !== 'done') return -1;
    if (a.status !== 'done' && b.status === 'done') return 1;
    const da = a.deadline || '9999', db = b.deadline || '9999';
    if (da !== db) return da < db ? -1 : 1;
    return priorityOrder(a.priority) - priorityOrder(b.priority);
  });

  el.innerHTML = `
    <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>СОТРУДНИК</th>
          <th>ЗАДАЧА</th>
          <th>ПРИОРИТЕТ</th>
          <th>СРОК</th>
          <th>СТАТУС</th>
          <th>КОММЕНТАРИЙ</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        ${tasks.map(t => {
          const badge = t.status === 'done' ? 'done' : t.isOverdue ? 'overdue' : 'pending';
          const label = t.status === 'done' ? 'Выполнено' : t.isOverdue ? 'Просрочено' : 'В работе';
          const dl = t.deadline ? new Date(t.deadline).toLocaleDateString('ru', {day:'numeric', month:'short'}) : '—';
          const pr = PRIORITY_LABELS[t.priority] || PRIORITY_LABELS.medium;
          const tJson = encodeURIComponent(JSON.stringify({id:t.id, employeeId:t.employeeId, employeeName:t.employeeName, title:t.title, deadline:t.deadline, priority:t.priority||'medium'}));
          return `
          <tr style="${t.status === 'done' ? 'opacity:0.65' : ''}">
            <td><strong>${t.employeeName}</strong></td>
            <td>${t.title}</td>
            <td><span style="font-size:12px;color:${pr.color}">${pr.label}</span></td>
            <td style="color:${t.isOverdue ? 'var(--danger)' : 'var(--text2)'}">${dl}</td>
            <td><span class="status-badge ${badge}">${label}</span></td>
            <td><span class="comment-text">${t.comment || '—'}</span></td>
            <td style="white-space:nowrap">
              <button class="btn small secondary" style="margin-right:6px" onclick="openEditTaskModal(decodeURIComponent('${tJson}'))">✏️</button>
              <button class="btn small danger" onclick="deleteTask('${t.id}')">🗑</button>
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
    </div>`;
}

function openAddTaskModal() {
  document.getElementById('taskTitle').value = '';
  document.getElementById('taskDeadline').value = '';
  openModal('modalTask');
}

async function submitTask() {
  const empId = document.getElementById('taskEmployee').value;
  const title = document.getElementById('taskTitle').value.trim();
  const deadline = document.getElementById('taskDeadline').value;
  const priority = document.getElementById('taskPriority').value;

  if (!empId || !title || !deadline) return alert('Заполни все поля');

  const emp = employees.find(e => e.id === empId);
  await api('addTask', { employeeId: empId, employeeName: emp.name, title, deadline, priority });

  closeModal('modalTask');
  loadTasks();
  loadDashboard();
}

// ============================================
// CHECKINS
// ============================================
async function loadCheckins() {
  const empId = document.getElementById('filterCheckinEmployee').value;
  const el = document.getElementById('checkinsContent');
  el.innerHTML = '<div class="loading"><div class="spinner"></div> Загрузка...</div>';

  const params = {};
  if (empId) params.employeeId = empId;

  const res = await api('getCheckins', params);
  if (!res.ok) return;

  const checkins = res.checkins.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

  if (!checkins.length) {
    el.innerHTML = emptyState('📋', 'Чекпоинтов пока нет', 'Они появятся после еженедельных отчётов сотрудников');
    return;
  }

  el.innerHTML = `<div class="checkin-list">${checkins.map(c => `
    <div class="checkin-card">
      <div class="checkin-header">
        <span class="checkin-who">${c.employeeName}</span>
        <span class="checkin-date">${new Date(c.createdAt).toLocaleDateString('ru', {day:'numeric', month:'long'})}</span>
      </div>
      <div class="checkin-block">
        <div class="checkin-block-label">Что сделано</div>
        <div class="checkin-block-text">${c.done}</div>
      </div>
      <div class="checkin-block">
        <div class="checkin-block-label">Планы на неделю</div>
        <div class="checkin-block-text">${c.willDo}</div>
      </div>
      ${c.needHelp ? `
      <div class="checkin-block">
        <div class="checkin-block-label">Нужна помощь</div>
        <div class="checkin-block-text">${c.needHelp}</div>
      </div>` : ''}
    </div>
  `).join('')}</div>`;
}

// ============================================
// NAV
// ============================================
function showSection(name, btn) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('section-' + name).classList.add('active');
  if (btn) btn.classList.add('active');

  if (name === 'tasks') loadTasks();
  if (name === 'checkins') loadCheckins();
  if (name === 'employees') renderEmployeesList();
}

// ============================================
// MODAL HELPERS
// ============================================
function openModal(id) {
  document.getElementById(id).classList.add('open');
}

function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => {
    if (e.target === m) closeModal(m.id);
  });
});

// ============================================
// EDIT / DELETE TASKS
// ============================================
function openEditTaskModal(jsonStr) {
  const t = JSON.parse(jsonStr);
  document.getElementById('editTaskId').value = t.id;
  document.getElementById('editTaskEmployee').value = t.employeeName;
  document.getElementById('editTaskTitle').value = t.title;
  document.getElementById('editTaskDeadline').value = t.deadline || '';
  const ps = document.getElementById('editTaskPriority');
  if (ps) ps.value = t.priority || 'medium';
  openModal('modalEditTask');
}

async function submitEditTask() {
  const id = document.getElementById('editTaskId').value;
  const title = document.getElementById('editTaskTitle').value.trim();
  const deadline = document.getElementById('editTaskDeadline').value;
  const priority = document.getElementById('editTaskPriority').value;
  if (!title || !deadline) return alert('Заполни все поля');
  const res = await api('editTask', { taskId: id, title, deadline, priority });
  if (!res.ok) { alert('Ошибка: ' + res.error); return; }
  closeModal('modalEditTask');
  loadTasks();
  loadDashboard();
}

async function deleteTask(taskId) {
  if (!confirm('Удалить задачу?')) return;
  const res = await api('deleteTask', { taskId });
  if (!res.ok) { alert('Ошибка удаления: ' + res.error); return; }
  loadTasks();
  loadDashboard();
}

// ============================================
// UTILS
// ============================================
const PRIORITY_LABELS = {
  critical: { label: '🔴 Критически', color: '#c94a4a' },
  high:     { label: '🟠 Важно',       color: '#c97b3a' },
  medium:   { label: '🟡 Средняя',     color: '#c9a96e' },
  low:      { label: '🟢 Малая',       color: '#4a9e6b' },
};
function priorityOrder(p) { return {critical:0,high:1,medium:2,low:3}[p] ?? 2; }

const PRIORITY_LABELS = {
  critical: { label: '🔴 Критически', color: '#c94a4a' },
  high:     { label: '🟠 Важно',       color: '#c97b3a' },
  medium:   { label: '🟡 Средняя',     color: '#c9a96e' },
  low:      { label: '🟢 Малая',       color: '#4a9e6b' },
};
function priorityOrder(p) { return {critical:0,high:1,medium:2,low:3}[p] ?? 2; }

function emptyState(icon, title, sub) {
  return `<div class="empty">
    <div class="empty-icon">${icon}</div>
    <div class="empty-title">${title}</div>
    <div class="empty-sub">${sub}</div>
  </div>`;
}
